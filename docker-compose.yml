# Every published port is bound to 127.0.0.1 (since 2026-11-01): reachable from this PC only,
# never from the network. Containers reach each other on the compose network, not through these.
# dashboard/build_dashboard.py refuses any other binding (Master Ref Section 3, "Published ports").
#
# Every image is pinned to an exact version AND the digest that version had when
# it was pinned (2026-10-24), so no pull, reinstall or `docker compose up` can
# change what runs. The tag is for people; with a digest present Docker uses the
# digest and ignores the tag. A Docker reinstall on 2026-10-23 re-pulled
# n8nio/n8n:latest and silently upgraded n8n 2.35.7 -> 2.44.6; that is what this
# prevents. Upgrading is a decision with its own steps: Master Ref Section 3,
# "Upgrading an image".
services:
  postgres:
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Prevents the postgres image from auto-creating a default database
      # named after POSTGRES_USER, which would collide with the
      # `novascout` database created by 01-init-databases.sql.
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.44.6@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Karachi
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"

  imap-health:
    # The IMAP health check's checker (Master Ref Section 9, Workflow 6). Runs
    # n8n/sendtrack/imap_preflight.py -- the pre-flight's connection logic,
    # unchanged -- when the "Send & Track - IMAP Health" workflow calls
    # http://imap-health:8765/check. It is a separate container because the n8n
    # image has no Python and n8n 2.x excludes the Execute Command node by
    # default; enabling that would give every workflow shell access.
    #
    # Deliberately small: only the mailbox's IMAP settings (not the whole .env),
    # code mounted read-only, a read-only filesystem, no root, and NO published
    # port -- every request logs in to the mailbox, unauthenticated, so it stays
    # on the compose network. build_workflow.py refuses a `ports:` here.
    image: python:3.12.15-alpine3.24@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NOVASCOUT_MAILBOX_ADDRESS: ${NOVASCOUT_MAILBOX_ADDRESS}
      NOVASCOUT_MAILBOX_PASSWORD: ${NOVASCOUT_MAILBOX_PASSWORD}
      NOVASCOUT_IMAP_HOST: ${NOVASCOUT_IMAP_HOST}
      NOVASCOUT_IMAP_PORT: ${NOVASCOUT_IMAP_PORT:-993}
      NOVASCOUT_MASTER_REF: /opt/novascout/NovaScout_MasterRef.md
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./n8n/sendtrack:/opt/novascout/sendtrack:ro
      - ./NovaScout_MasterRef.md:/opt/novascout/NovaScout_MasterRef.md:ro
    command: ["python", "-u", "/opt/novascout/sendtrack/imap_health_server.py"]

  smtp-send:
    # The reply assistant's sender (Master Ref Section 9, Workflow 7). Runs
    # n8n/sendtrack/smtp_send_server.py, which the "Send & Track - Send Reply"
    # workflow calls at http://smtp-send:8766/send.
    #
    # It exists for one measured reason: a reply has to carry In-Reply-To and
    # References, and n8n's Send Email node cannot set them -- read from the
    # installed node on 2026-10-09, it builds nodemailer's mailOptions from a
    # fixed field set with no headers option. nodemailer supports them; n8n does
    # not pass them. That file has the detail. The COLD send path is untouched
    # and still goes through the Send Email node.
    #
    # Same containment as imap-health, and for a stronger reason -- this one can
    # send mail: only the mailbox's own SMTP settings (not the whole .env), code
    # mounted read-only, a read-only filesystem, no root, and NO published port.
    # It has no authentication of its own, so it stays on the compose network,
    # and it refuses to send as any From but the configured mailbox.
    # build_workflow.py refuses a `ports:` here.
    image: python:3.12.15-alpine3.24@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NOVASCOUT_MAILBOX_ADDRESS: ${NOVASCOUT_MAILBOX_ADDRESS}
      NOVASCOUT_MAILBOX_PASSWORD: ${NOVASCOUT_MAILBOX_PASSWORD}
      NOVASCOUT_SMTP_HOST: ${NOVASCOUT_SMTP_HOST}
      NOVASCOUT_SMTP_PORT: ${NOVASCOUT_SMTP_PORT:-465}
      NOVASCOUT_SENDER_NAME: ${NOVASCOUT_SENDER_NAME}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./n8n/sendtrack:/opt/novascout/sendtrack:ro
    command: ["python", "-u", "/opt/novascout/sendtrack/smtp_send_server.py"]

  nocodb:
    image: nocodb/nocodb:2026.10.0@sha256:e8fee91b205b7c51df6e35a9d890d8b68b216e987ed3feb387c5478dff6df951
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Required for the Workflow 5 review queue. NocoDB refuses to connect a
      # data source to an RFC1918 address by default (SSRF protection) and
      # answers "Connection to internal hosts is not allowed" — which is exactly
      # what `postgres:5432` on the compose network is. Every service here is on
      # that private network by design, so the protection has nothing to protect:
      # NocoDB reaching Postgres is the intended architecture, not an attacker
      # pivoting through it.
      #
      # This does NOT expose anything new. NocoDB is bound to 127.0.0.1:8080 and
      # the Postgres credentials still gate the connection. Do not carry this
      # setting to an internet-facing NocoDB.
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    volumes:
      - nocodb_data:/usr/app/data
    ports:
      - "127.0.0.1:8080:8080"

  grafana:
    # Dashboard v1 (Master Ref Section 9, "Dashboard"; dashboard/README.md): one
    # read-only page for this PC. Reads the novascout database only as the role
    # nova_dashboard (migration 033), which can read the `metrics` views and
    # nothing else, so a panel cannot see or change anything those views do not
    # show. The data source and the dashboard are provisioned read-only from
    # ./dashboard/grafana; Grafana's own state (users, sessions) is in
    # grafana_data.
    #
    # Published on 127.0.0.1 only: reachable from this PC, from nothing else on
    # the network. No alerting, no sign-up, no anonymous access, no calls home
    # (usage reporting, update checks, news, plugin preinstall all off).
    # build_dashboard.py's drift guard refuses a port that is not 127.0.0.1.
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${NOVASCOUT_GRAFANA_ADMIN_PASSWORD}
      NOVASCOUT_DASHBOARD_DB_PASSWORD: ${NOVASCOUT_DASHBOARD_DB_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/nova-scout.json
      GF_LOG_MODE: console
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboard/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboard/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  dashboard:
    # The custom dashboard page (dashboard v1.1; Master Ref Section 9, "Dashboard";
    # dashboard/README.md): the reference design with live numbers, at
    # http://127.0.0.1:3001. Grafana stays as the detailed view.
    #
    # Reads the novascout database only as the role nova_dashboard (migration
    # 033) -- the same role and the same `metrics` views as Grafana -- so it can
    # show nothing those views do not, and write nothing. It is given that
    # role's password and nothing else: not the superuser's, not the mailbox's.
    # Same containment as the sidecars above: the pinned python image with
    # nothing installed, code mounted read-only, read-only filesystem, no root.
    # dashboard/web/server.py has no driver dependency (pgmini.py speaks the
    # protocol itself) and the page makes no request beyond its own origin.
    #
    # Published on 127.0.0.1 only. build_dashboard.py's drift guard refuses any
    # other binding, any other image, and any credential this service should not
    # have.
    image: python:3.12.15-alpine3.24@sha256:b658b05ce9c4eb97ec6fc19424818a1f31993659c2b505a532f470e83807815d
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    environment:
      NOVASCOUT_DASHBOARD_DB_PASSWORD: ${NOVASCOUT_DASHBOARD_DB_PASSWORD}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./dashboard/web:/opt/novascout/dashboard:ro
    ports:
      - "127.0.0.1:3001:3001"
    command: ["python", "-u", "/opt/novascout/dashboard/server.py"]

volumes:
  postgres_data:
  n8n_data:
  nocodb_data:
  grafana_data:
