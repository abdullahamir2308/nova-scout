# The dashboard is a file in the repo (dashboard/grafana/dashboards/nova-scout.json,
# generated by dashboard/build_dashboard.py). Grafana loads it at start and re-reads
# it every 60 s; it cannot be saved or deleted from the UI, so the repo copy is
# always the one running.
apiVersion: 1

providers:
  - name: nova-scout
    type: file
    folder: ''
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
